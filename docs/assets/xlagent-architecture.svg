<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" role="img" aria-labelledby="t d"><title id="t">XLAgent architecture and scoring boundary</title><desc id="d">A read-only localizer, contract evidence, editor, validation gate and visible tests operate on an isolated pre-fix snapshot. Failures return to investigation. Hidden scoring is separate and never fed back to the agent.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b9271"/></marker></defs><rect width="1000" height="305" rx="12" fill="#fbfcf7"/><text x="30" y="29" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#36513b">VISIBLE TASK EVIDENCE</text><text x="810" y="29" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#36513b">OUTSIDE THE AGENT LOOP</text><rect x="25" y="76" width="155" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="102.5" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Issue + pre-fix code</text><text x="102.5" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Isolated snapshot</text><path d="M180 103H220" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="220" y="76" width="165" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="302.5" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Read-only localizer</text><text x="302.5" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Find both sides</text><path d="M385 103H425" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="425" y="76" width="165" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="507.5" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Contract evidence</text><text x="507.5" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Up to 3 hypotheses</text><path d="M590 103H630" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="630" y="76" width="150" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="705.0" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Editing agent</text><text x="705.0" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Reproduce + patch</text><path d="M705 130V170" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="630" y="170" width="150" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="705.0" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Validation gate</text><text x="705.0" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">New basic errors</text><path d="M630 197H590" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="425" y="170" width="165" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="507.5" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Visible repository tests</text><text x="507.5" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Compare with original</text><path d="M425 197H302V130" fill="none" stroke="#7b9271" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="270" y="242" text-anchor="start" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">New failures route back to investigation</text><rect x="815" y="170" width="160" height="54" rx="8" fill="#f6ede1" stroke="#dfc8a8"/><text x="895.0" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Hidden scoring</text><text x="895.0" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Fail-to-pass overlay</text><path d="M780 197H815" fill="none" stroke="#7b9271" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="43" y="167" text-anchor="start" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">SCIP + syntax extraction</text><text x="43" y="187" text-anchor="start" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">add boundary mediators;</text><text x="43" y="207" text-anchor="start" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">graph tools expose evidence.</text><text x="35" y="281" text-anchor="start" font-family="system-ui,sans-serif" font-size="11" fill="#7a856e">Feedback guides edits. Hidden scoring evaluates them. Neither patch shape nor one-sided tests prove full correctness.</text></svg>