<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" role="img" aria-labelledby="t d"><title id="t">LLM-ProS evaluation architecture</title><desc id="d">Problem extraction and validation lead to one candidate per model and official judging. Verdicts and resource evidence are logged; no feedback revision occurs.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b9271"/></marker></defs><rect width="1000" height="305" rx="12" fill="#fbfcf7"/><text x="30" y="29" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#36513b">ONE CANDIDATE PER MODEL AND TASK</text><rect x="25" y="93" width="160" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="105.0" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">166 ICPC problems</text><text x="105.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">2011 to 2024</text><path d="M185 120H220" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="220" y="93" width="165" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="302.5" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Extract + validate</text><text x="302.5" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Constraints, examples</text><path d="M385 120H420" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="420" y="93" width="160" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="500.0" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Prompt each model</text><text x="500.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Five model families</text><path d="M580 120H615" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="615" y="93" width="150" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="690.0" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">One response</text><text x="690.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">No judge revision</text><path d="M765 120H800" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="800" y="93" width="170" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="885.0" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Codeforces Gym</text><text x="885.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Compile + execute</text><path d="M885 147V187H570" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="390" y="164" width="180" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="480.0" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Log verdict + resources</text><text x="480.0" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Accepted / CE / WA / ...</text><text x="47" y="255" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#36513b">CHECK THE EVIDENCE</text><text x="47" y="277" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Extraction fidelity → prompt differences → judge validity → bounded conclusions</text></svg>