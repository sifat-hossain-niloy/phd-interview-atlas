<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" role="img" aria-labelledby="t d"><title id="t">A-ProS generator-critic feedback loop</title><desc id="d">A generator writes a solution, the judge accepts or rejects it, and a critic provides a hint after failure. A revision returns to the generator with retained conversation, up to four submissions total.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b9271"/></marker></defs><rect width="1000" height="305" rx="12" fill="#fbfcf7"/><text x="30" y="29" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#36513b">ONE INITIAL SUBMISSION + UP TO THREE REFINEMENTS</text><rect x="25" y="95" width="150" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="100.0" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Problem statement</text><text x="100.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Public examples</text><path d="M175 122H210" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="210" y="95" width="165" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="292.5" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Generator</text><text x="292.5" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">GPT-4 or GPT-5</text><path d="M375 122H410" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="410" y="95" width="155" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="487.5" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Judge submission</text><text x="487.5" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Official verdict</text><path d="M565 122H615" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="615" y="95" width="170" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="700.0" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Critic on failure</text><text x="700.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">1 of 3 critic models</text><path d="M785 122H825" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><rect x="825" y="95" width="150" height="54" rx="8" fill="#edf2e5" stroke="#c1cdb3"/><text x="900.0" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Targeted hint</text><text x="900.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#36513b">Available diagnostics</text><path d="M490 95V59H710" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><text x="725" y="63" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Accepted: stop</text><path d="M900 149V207H292V149" fill="none" stroke="#7b9271" stroke-width="1.4"  marker-end="url(#a)"/><text x="600" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#36513b">REVISION WITH PRIOR CONVERSATION</text><text x="35" y="258" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#36513b">Memory ablation: full history vs latest verdict + hint only.</text><text x="35" y="282" text-anchor="start" font-family="system-ui,sans-serif" font-size="11" fill="#7a856e">Equal submission budgets do not automatically equalize token budgets.</text></svg>